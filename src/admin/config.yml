# Sveltia CMS configuration (Decap/Netlify CMS-compatible format)
# Auth: GitHub. Two sign-in options appear on /admin/:
#   1. "Sign In with GitHub" — uses Netlify's built-in OAuth provider
#      (requires a GitHub OAuth app registered under Netlify site settings).
#   2. "Sign In Using Access Token" — paste a GitHub fine-grained token
#      with Contents: read/write on this repo. No server setup needed.
# Local editing: open /admin/ on localhost and choose "Work with Local Repository".
backend:
  name: github
  repo: ikaikahussey/addhomonym
  branch: master
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: https://addhomonym.com
display_url: https://addhomonym.com

media_folder: "src/static/img"
public_folder: "/static/img"

slug:
  encoding: ascii
  clean_accents: true

collections:
  - label: "Posts"
    label_singular: "Post"
    name: "posts"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Author", name: "author", widget: "string", default: "ikaikahussey", required: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Tags", name: "tag", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
